<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 2500px;
    height: 843px;
    overflow: hidden;
    background-color: #F8FAFC;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 36px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  .card {
    width: 100%;
    height: 100%;
    border-radius: 44px;
    background: linear-gradient(135deg, #06C755 0%, #059E43 100%);
    box-shadow: 0 20px 44px rgba(6, 199, 85, 0.28), 0 4px 14px rgba(0, 0, 0, 0.04);
    border: 2px solid rgba(255, 255, 255, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    user-select: none;
  }
  .icon {
    font-size: 170px;
    line-height: 1;
    margin-bottom: 24px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.14));
  }
  .title {
    font-size: 120px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 4px;
    margin-bottom: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x1F389;</div>
    <div class="title">新進同仁入職登記</div>
  </div>
</body>
</html>
